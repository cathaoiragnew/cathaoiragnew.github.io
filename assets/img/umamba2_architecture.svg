<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 830" width="760" height="830" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">U-Mamba2 architecture (ToothFairy3 Task 1)</title>
  <desc id="d">A CBCT patch of 160 by 288 by 288 voxels goes through a seven-stage residual encoder that shrinks it to 5 by 9 by 9 with 320 channels. At the bottleneck the features are flattened into 405 tokens, normalised and passed through a Mamba2 layer, then reshaped. A six-stage decoder upsamples with transposed convolutions, concatenates the encoder skips and outputs 47 class scores per voxel. Around the network: self-supervised pretraining, a loss with label smoothing and class weights, left-right mirroring with label swapping, and connected-component post-processing.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6a65"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
      .h { font-size: 14.5px; font-weight: 600; }
      .b { font-size: 12.5px; fill: #c3c2b7; }
      .s { font-size: 12px; fill: #c3c2b7; }
      .m { font-size: 12px; fill: #ffffff; font-variant-numeric: tabular-nums; }
      .k { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; fill: #c3c2b7; }
      .n { font-size: 12px; fill: #c3c2b7; font-style: italic; }
      .box { fill: #1a1a19; stroke: #4a4945; stroke-width: 1; }
      .io { fill: #2c2c2a; stroke: #6b6a65; stroke-width: 1; }
      .mb { fill: #1d2733; stroke: #3987e5; stroke-width: 1.5; }
      .lane { fill: #0f0f0e; stroke: #2c2c2a; stroke-width: 1; }
      .dash { fill: none; stroke: #6b6a65; stroke-width: 1; stroke-dasharray: 5 4; }
      .a { stroke: #c3c2b7; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .sk { stroke: #6b6a65; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; marker-end: url(#arr2); }
    </style>
  </defs>

  <!-- Input and output -->
  <rect class="io" x="8" y="8" width="300" height="58" rx="8"/>
  <text class="h" x="158" y="32" text-anchor="middle">CBCT patch, 160×288×288 voxels</text>
  <text class="b" x="158" y="52" text-anchor="middle">0.3 mm voxels, 1 channel (CT-normalised)</text>
  <rect class="io" x="452" y="8" width="300" height="58" rx="8"/>
  <text class="h" x="602" y="32" text-anchor="middle">47 scores per voxel</text>
  <text class="b" x="602" y="52" text-anchor="middle">background + 46 classes (pulps merged)</text>
  <path class="a" d="M158,66 V88"/>
  <path class="a" d="M602,88 V70"/>

  <text class="k" x="24" y="84">ENCODER (RESIDUAL BLOCKS)</text>
  <text class="k" x="736" y="84" text-anchor="end">DECODER</text>

  <!-- Encoder stages: channels · size · residual blocks -->
  <g>
    <rect class="box" x="24" y="92" width="268" height="30" rx="5"/>
    <text class="m" x="36" y="112">32 ch · 160×288×288</text><text class="s" x="280" y="112" text-anchor="end">1 block</text>
    <rect class="box" x="24" y="130" width="268" height="30" rx="5"/>
    <text class="m" x="36" y="150">64 ch · 80×144×144</text><text class="s" x="280" y="150" text-anchor="end">3 blocks</text>
    <rect class="box" x="24" y="168" width="268" height="30" rx="5"/>
    <text class="m" x="36" y="188">128 ch · 40×72×72</text><text class="s" x="280" y="188" text-anchor="end">4 blocks</text>
    <rect class="box" x="24" y="206" width="268" height="30" rx="5"/>
    <text class="m" x="36" y="226">256 ch · 20×36×36</text><text class="s" x="280" y="226" text-anchor="end">6 blocks</text>
    <rect class="box" x="24" y="244" width="268" height="30" rx="5"/>
    <text class="m" x="36" y="264">320 ch · 10×18×18</text><text class="s" x="280" y="264" text-anchor="end">6 blocks</text>
    <rect class="box" x="24" y="282" width="268" height="30" rx="5"/>
    <text class="m" x="36" y="302">320 ch · 5×9×9</text><text class="s" x="280" y="302" text-anchor="end">6 blocks</text>
    <rect class="box" x="24" y="320" width="268" height="30" rx="5"/>
    <text class="m" x="36" y="340">320 ch · 5×9×9</text><text class="s" x="280" y="340" text-anchor="end">6 blocks</text>
  </g>
  <text class="n" x="24" y="370">stages 2–6 halve every side; stage 7 keeps 5×9×9</text>

  <!-- Decoder stages -->
  <g>
    <rect class="box" x="468" y="92" width="268" height="30" rx="5"/>
    <text class="m" x="480" y="112">32 ch · 160×288×288</text>
    <rect class="box" x="468" y="130" width="268" height="30" rx="5"/>
    <text class="m" x="480" y="150">64 ch · 80×144×144</text>
    <rect class="box" x="468" y="168" width="268" height="30" rx="5"/>
    <text class="m" x="480" y="188">128 ch · 40×72×72</text>
    <rect class="box" x="468" y="206" width="268" height="30" rx="5"/>
    <text class="m" x="480" y="226">256 ch · 20×36×36</text>
    <rect class="box" x="468" y="244" width="268" height="30" rx="5"/>
    <text class="m" x="480" y="264">320 ch · 10×18×18</text>
    <rect class="box" x="468" y="282" width="268" height="30" rx="5"/>
    <text class="m" x="480" y="302">320 ch · 5×9×9</text>
  </g>
  <text class="n" x="684" y="336" text-anchor="end">upsample (transposed conv), concatenate</text>
  <text class="n" x="684" y="352" text-anchor="end">the skip, then convolutions at each stage</text>

  <!-- Skips -->
  <path class="sk" d="M292,107 H464"/>
  <path class="sk" d="M292,145 H464"/>
  <path class="sk" d="M292,183 H464"/>
  <path class="sk" d="M292,221 H464"/>
  <path class="sk" d="M292,259 H464"/>
  <path class="sk" d="M292,297 H464"/>
  <text class="n" x="380" y="138" text-anchor="middle">skip connections</text>

  <!-- Bottleneck Mamba2 -->
  <path class="a" d="M158,350 V396"/>
  <rect class="mb" x="24" y="398" width="712" height="104" rx="8"/>
  <text class="k" x="40" y="420" style="fill:#8fbaf0">BOTTLENECK · THE ONLY PLACE MAMBA2 IS USED</text>
  <text class="b" x="40" y="444">flatten 5×9×9 into a sequence of 405 tokens, each 320 numbers</text>
  <text class="b" x="40" y="464">→ LayerNorm → Mamba2 (state size 32, 8 heads of 80)</text>
  <text class="b" x="40" y="484">→ reshape back to 5×9×9 (one pass over the sequence, in raster order)</text>
  <path class="a" d="M700,398 V316"/>

  <!-- Task 2 branch -->
  <rect class="dash" x="24" y="512" width="712" height="40" rx="6"/>
  <text class="s" x="380" y="537" text-anchor="middle">Task 2 only: user clicks → point encoder → two cross-attention blocks with the Mamba2 output</text>

  <!-- Around the network -->
  <rect class="lane" x="8" y="570" width="744" height="252" rx="10"/>
  <text class="k" x="24" y="594">AROUND THE NETWORK</text>

  <rect class="box" x="24" y="606" width="352" height="100" rx="6"/>
  <text class="h" x="38" y="630">Self-supervised pretraining</text>
  <text class="b" x="38" y="656">disruptive autoencoder: mask, downsample and add</text>
  <text class="b" x="38" y="676">noise to a scan, then reconstruct it (L1 loss); uses</text>
  <text class="b" x="38" y="696">371 extra unlabelled CBCTs (STS-3D-Tooth)</text>

  <rect class="box" x="384" y="606" width="352" height="100" rx="6"/>
  <text class="h" x="398" y="630">Loss: Dice + cross-entropy</text>
  <text class="b" x="398" y="656">label smoothing: 0.9 on the true class, 0.1 shared</text>
  <text class="b" x="398" y="676">by related classes; 10× loss weight on</text>
  <text class="b" x="398" y="696">the incisive and lingual canals</text>

  <rect class="box" x="24" y="714" width="352" height="100" rx="6"/>
  <text class="h" x="38" y="738">Mirroring with label swap</text>
  <text class="b" x="38" y="764">when a scan is flipped left–right (augmentation</text>
  <text class="b" x="38" y="784">or test-time), left/right labels and predictions</text>
  <text class="b" x="38" y="804">are swapped with their partners</text>

  <rect class="box" x="384" y="714" width="352" height="100" rx="6"/>
  <text class="h" x="398" y="738">Post-processing</text>
  <text class="b" x="398" y="764">drop connected components smaller than a per-class</text>
  <text class="b" x="398" y="784">threshold: the 0.5th percentile of component</text>
  <text class="b" x="398" y="804">volumes in the ground truth</text>
</svg>
